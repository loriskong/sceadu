name: Update design doc

# Push trigger is disabled until the Feishu bot has edit access to the
# design document and the repository secrets are configured. Use
# workflow_dispatch, or run scripts/update-design-doc.py locally.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: design-doc-sync
  cancel-in-progress: false

jobs:
  append:
    name: Append code update to Feishu
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install lark-cli
        run: npm install --global @larksuite/cli@1.0.77

      - name: Append entry
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_DOC_TOKEN: ${{ secrets.FEISHU_DOC_TOKEN }}
          FEISHU_AS: bot
        run: python3 scripts/update-design-doc.py
