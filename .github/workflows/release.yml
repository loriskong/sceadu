name: release

on:
  push:
    tags:
      - "v0.1.0-build*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build static release
        run: cargo build --release --locked --target x86_64-unknown-linux-musl
      - name: Package release
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          rm -rf dist
          mkdir -p dist/sceadu
          cp target/x86_64-unknown-linux-musl/release/sceadu dist/sceadu/
          cp README.md AGENTS.md dist/sceadu/
          cp scripts/install-release.sh dist/sceadu/install.sh
          cp skills/sceadu/SKILL.md dist/sceadu/SKILL.md
          chmod +x dist/sceadu/install.sh
          archive="sceadu-${tag}-x86_64-unknown-linux-musl.tar.gz"
          tar -C dist -czf "$archive" sceadu
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish private release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          gh release create "$tag" \
            "sceadu-${tag}-x86_64-unknown-linux-musl.tar.gz" \
            "sceadu-${tag}-x86_64-unknown-linux-musl.tar.gz.sha256" \
            --title "Sceadu ${tag}" \
            --notes "Pre-alpha test build. Download on a trusted machine and scp to the target host. Run install.sh from the extracted directory." \
            --prerelease
