[workspace]
resolver = "2"
members = ["crates/sceadu-core", "crates/sceadu-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
bs58 = "0.5"
ciborium = "0.2"
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
libp2p-stream = "0.5.0-alpha"
libp2p = { version = "0.57", features = ["tokio", "tcp", "noise", "yamux", "request-response", "json", "macros", "ed25519", "kad", "relay"] }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled"] }
data-encoding = "2"
tokio-socks = "0.5"
tokio-util = { version = "0.7", features = ["compat"] }
rpassword = "7"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-std", "io-util"] }
zeroize = { version = "1", features = ["derive"] }
